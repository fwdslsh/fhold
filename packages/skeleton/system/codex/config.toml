# Image-baked native plugins; native operator consent controls their hooks.

[features]
hooks = true

[marketplaces.akm-plugins]
source_type = "local"
source = "/akm-marketplace"

[plugins."akm@akm-plugins"]
enabled = true

[marketplaces.fhold-plugins]
source_type = "local"
source = "/fhold-plugins"

[plugins."fhold@fhold-plugins"]
enabled = true
