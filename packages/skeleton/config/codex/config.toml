# Operator-owned native defaults. requirements.toml enforces restrictions.
approval_policy = "on-request"

[marketplaces.akm-plugins]
source_type = "local"
source = "/akm-marketplace"

[plugins."akm@akm-plugins"]
enabled = true

[marketplaces.fhold-plugins]
source_type = "local"
source = "/fhold-plugins"

[plugins."fhold@fhold-plugins"]
enabled = true
