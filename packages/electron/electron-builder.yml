appId: dev.fwdslsh.fhold.admin
productName: fhold Admin
artifactName: fhold-admin-${version}-${arch}-${os}.${ext}

directories:
  output: dist/packages
  buildResources: assets

files:
  - dist/admin-main.js
  - dist/admin-preload.cjs
  - admin/**/*
  - assets/icon.png
  - package.json

extraResources:
  - from: ../cli/embedded/fhold-linux-x64
    to: management/fhold-linux-x64
  - from: ../cli/embedded/fhold-linux-arm64
    to: management/fhold-linux-arm64
  - from: dist/skeleton
    to: skeleton

publish:
  provider: github
  owner: fwdslsh
  repo: fhold
npmRebuild: false

linux:
  executableName: fhold-admin
  syncDesktopName: true
  target:
    - AppImage
  icon: assets/icon.png

win:
  target: nsis
  icon: assets/icon.png

nsis:
  oneClick: true
  perMachine: false
  createStartMenuShortcut: true
  createDesktopShortcut: false
  shortcutName: fhold Admin
  runAfterFinish: false

mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  icon: assets/icon.png
