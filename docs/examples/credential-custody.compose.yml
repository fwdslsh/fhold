# Experimental Docker-only MVP. Merge into config/stack/custom.compose.yml.
# Requires Docker Compose 2.24.4+ for !override. No commands are allowed until
# the operator installs native sudoers rules; see ../credential-custody.md.
services:
  assistant:
    # This opt-in permits sudo's UID transition; normal fhold stays hardened.
    security_opt: !override [no-new-privileges:false]
    cap_add: [SETUID, SETGID]
    volumes:
      - credential-home:/var/lib/fhold-credentials
      - credential-policy:/etc/sudoers.d

volumes:
  credential-home: {}
  credential-policy: {}
