name: stack gates

on:
  workflow_call:
    inputs:
      scope:
        type: string
        default: full
      images:
        type: string
        default: '["assistant","guardian","portal"]'

permissions:
  contents: read

jobs:
  quality:
    name: stack quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install the single locked workspace
        run: bun install --frozen-lockfile
      - name: Type check active packages
        if: inputs.scope != 'tools'
        run: bun run check
      - name: Test active packages
        if: inputs.scope != 'tools'
        env:
          FH_SOCKET_TESTS: '1'
        run: bun run test
      - name: Check and test tooling
        if: inputs.scope == 'tools'
        env:
          FH_SOCKET_TESTS: '1'
        run: |
          bun run --cwd packages/lib typecheck
          bun run --cwd packages/cli typecheck
          bun run --cwd packages/electron typecheck
          bun run lib:test
          bun run cli:test
          bun run --cwd packages/electron test
          bun test scripts/bump-release.test.ts scripts/set-version.test.ts scripts/tooling-release.test.ts scripts/ci-scope.test.ts scripts/smoke-assistant-ci.test.ts scripts/release-aggregates-hygiene.test.ts scripts/packaged-assets.test.ts scripts/admin-update-feeds.test.ts scripts/release-qualification.test.ts scripts/management-architecture.test.ts
      - name: Lint
        run: bun run lint
      - name: Build the standalone CLI
        run: bun run --cwd packages/cli build
      - name: Build and validate the optional Claude Desktop extension
        if: inputs.scope != 'tools'
        run: bun run --cwd packages/claude-desktop pack
      - name: Verify the embedded Skeleton
        run: bun test scripts/packaged-assets.test.ts
      - name: Bundle the optional admin app
        run: bun run --cwd packages/electron bundle
      - name: Qualify the Admin renderer in Chromium
        if: inputs.scope == 'tools'
        run: bun run --cwd packages/electron test:providers:browser
      - name: Validate shell entrypoints
        if: inputs.scope != 'tools'
        run: bash -n scripts/dev-setup.sh scripts/smoke-image.sh containers/assistant/entrypoint.sh containers/assistant/healthcheck.sh containers/guardian/entrypoint.sh
      - name: Validate the materialized Compose project
        if: inputs.scope != 'tools'
        env:
          FH_HOME: ${{ runner.temp }}/fhold-ci
          FH_REPO_ROOT: ${{ github.workspace }}
        run: |
          bun run packages/cli/src/main.ts install --no-start
          docker compose \
            --project-name fhold-ci \
            --project-directory "${GITHUB_WORKSPACE}" \
            -f "${FH_HOME}/system/stack/stack.compose.yml" \
            -f "${FH_HOME}/config/stack/custom.compose.yml" \
            --env-file "${FH_HOME}/state/stack.env" \
            --profile gateway --profile discord --profile slack \
            config --quiet
      - name: Audit dependencies with reviewed specific exceptions
        # Audit remains mandatory, but new advisories must not hide source-test failures.
        # Exact reviewed exceptions are documented in docs/operations/release.md.
        run: bun run audit

  images:
    if: inputs.scope != 'tools'
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        image: ${{ fromJSON(inputs.images) }}
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Assert native architecture for runtime tests
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "${PLATFORM}" in
            linux/amd64) test "$(uname -m)" = x86_64 ;;
            linux/arm64) test "$(uname -m)" = aarch64 ;;
            *) exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: containers/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: fhold/${{ matrix.image }}:ci
          build-args: ${{ matrix.image == 'guardian' && 'GUARDIAN_VERSION=ci' || 'PLATFORM_VERSION=ci' }}
          cache-from: type=gha,scope=fhold-${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=fhold-${{ matrix.image }}-${{ matrix.platform }},mode=max
      - name: Assert a non-root runtime user
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          user="$(docker image inspect "fhold/${IMAGE}:ci" --format '{{.Config.User}}')"
          test -n "${user}"
          test "${user}" != root
          test "${user}" != 0
      - name: Report all high and critical runtime image advisories
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fhold/${{ matrix.image }}:ci
          version: v0.76.1
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Reject every critical runtime image advisory
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: .github/trivy-ignore.yaml
        with:
          image-ref: fhold/${{ matrix.image }}:ci
          version: v0.76.1
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Reject fixable high runtime image advisories
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: .github/trivy-ignore.yaml
        with:
          image-ref: fhold/${{ matrix.image }}:ci
          version: v0.76.1
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Run image startup and security smoke
        if: matrix.image != 'assistant'
        env:
          IMAGE: ${{ matrix.image }}
        run: bash scripts/smoke-image.sh "fhold/${IMAGE}:ci" "${IMAGE}"
      - uses: oven-sh/setup-bun@v2.2.0
        if: matrix.image == 'assistant'
        with:
          bun-version: 1.4.4
      - name: Install locked workspace for native history verification
        if: matrix.image == 'assistant'
        run: bun install --frozen-lockfile
      - name: Verify all native Assistant suites in two isolated lanes
        if: matrix.image == 'assistant'
        env:
          FH_CI_LOG_DIR: ${{ runner.temp }}/assistant-smokes
        run: node scripts/smoke-assistant-ci.mjs fhold/assistant:ci
      - name: Retain Assistant suite logs and timings
        if: always() && matrix.image == 'assistant'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: assistant-smokes-${{ runner.arch }}
          path: ${{ runner.temp }}/assistant-smokes
          if-no-files-found: warn
          retention-days: 7
