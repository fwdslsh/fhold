name: GitHub CI

on:
  pull_request:
    # Docs/site changes have their own strict Unify verification workflow.
    # Do not ignore all Markdown: runtime skills and prompts also use .md.
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'README.md'
      - '.github/workflows/deploy-docs.yml'
      - 'bun.lock'
  push:
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'README.md'
      - '.github/workflows/deploy-docs.yml'
      - 'bun.lock'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI and release call the same reusable stack gate.
  gates:
    uses: ./.github/workflows/gates.yml
