name: GitHub CI

on:
  pull_request:
    # Docs/site changes have their own strict Unify verification workflow.
    # Do not ignore all Markdown: runtime skills and prompts also use .md.
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'README.md'
      - '.github/workflows/deploy-docs.yml'
  push:
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'README.md'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bun scripts/ci-scope.mjs
  # CI and release call the same reusable stack gate.
  gates:
    needs: scope
    uses: ./.github/workflows/gates.yml
    with:
      scope: ${{ needs.scope.outputs.scope }}
