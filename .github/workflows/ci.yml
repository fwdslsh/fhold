name: GitHub CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    # Docs/site changes have their own strict Unify verification workflow.
    # Do not ignore all Markdown: runtime skills and prompts also use .md.
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'README.md'
      - 'bun.lock'
      - '.github/workflows/deploy-docs.yml'
  push:
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'README.md'
      - 'bun.lock'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: read

concurrency:
  # An irrelevant edit must not cancel the current commit's real verification.
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && github.run_id || 'checks' }}
  cancel-in-progress: true

jobs:
  scope:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'Ignored text edit' || 'scope' }}
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      images: ${{ steps.scope.outputs.images }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bun scripts/ci-scope.mjs
  # CI and release call the same reusable stack gate.
  gates:
    needs: scope
    if: needs.scope.outputs.scope != 'none'
    uses: ./.github/workflows/gates.yml
    with:
      scope: ${{ needs.scope.outputs.scope }}
      images: ${{ needs.scope.outputs.images }}
