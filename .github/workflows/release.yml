name: GitHub Linux release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stamped publication version, chosen after functional validation (for example 0.3.261000-beta)'
        required: true
        type: string
      dry_run:
        description: 'Build and validate without publishing'
        required: false
        type: boolean
        default: true
      scope:
        description: 'auto uses stamped component versions; tools publishes CLI/Admin only'
        type: choice
        options: [auto, full, tools]
        default: auto

concurrency:
  group: release-fhold-fhold
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      channel: ${{ steps.version.outputs.channel }}
      scope: ${{ steps.version.outputs.scope }}
      qualified: ${{ steps.qualification.outputs.reused }}
      candidate_run: ${{ steps.qualification.outputs.run_id }}
      candidate_attempt: ${{ steps.qualification.outputs.attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - id: version
        name: Validate the stamped release
        env:
          VERSION: ${{ inputs.version }}
          SCOPE: ${{ inputs.scope }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_REF: ${{ github.ref }}
          ACTIONS_ORIGIN: ${{ github.server_url }}
          ACTIONS_REPOSITORY: ${{ github.repository }}
          FH_PUBLICATION_CONFIGURED: ${{ vars.FH_PUBLICATION_CONFIGURED }}
        run: |
          bun - <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { parseSemver } from './scripts/set-version.mjs';
          import { gitScope } from './scripts/ci-scope.mjs';
          const version = process.env.VERSION ?? '';
          if (process.env.ACTIONS_ORIGIN !== 'https://github.com' ||
              process.env.ACTIONS_REPOSITORY !== 'fwdslsh/fhold') {
            throw new Error('Releases build and publish only on GitHub fwdslsh/fhold');
          }
          const parsed = parseSemver(version);
          if (!parsed) throw new Error(`Invalid version: ${version}`);
          if (process.env.DRY_RUN !== 'true' && process.env.FH_PUBLICATION_CONFIGURED !== 'true') {
            throw new Error('Public publication is unconfigured and deferred');
          }
          if (process.env.DRY_RUN !== 'true' &&
              process.env.RELEASE_REF !== 'refs/heads/main' &&
              !process.env.RELEASE_REF.startsWith('refs/heads/release/')) {
            throw new Error('Live releases require main/release/*');
          }
          const release = JSON.parse(readFileSync('.github/release-manifest.json', 'utf8'));
          const runtimeVersion = JSON.parse(readFileSync('packages/skeleton/package.json', 'utf8')).version;
          const scope = (process.env.SCOPE || 'auto') === 'auto' ? (runtimeVersion === version ? 'full' : 'tools') : process.env.SCOPE;
          const manifests = scope === 'tools' ? release.toolingManifests : release.manifests;
          if (scope === 'tools' && gitScope(runtimeVersion) !== 'tools') {
            throw new Error('Runtime inputs changed since the pinned image release. Stamp a full release instead.');
          }
          for (const manifest of manifests) {
            const actual = JSON.parse(readFileSync(manifest, 'utf8')).version;
            if (actual !== version) throw new Error(`${manifest} is ${actual}; expected ${version}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nscope=${scope}\nprerelease=${parsed.pre !== null}\nchannel=${parsed.pre?.split('.')[0] ?? 'latest'}\n`);
          NODE

      - id: qualification
        name: Reuse successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ steps.version.outputs.scope }}
        run: bun scripts/release-qualification.mjs

  gates:
    if: needs.validate.outputs.qualified != 'true'
    needs: validate
    uses: ./.github/workflows/gates.yml
    with:
      scope: ${{ needs.validate.outputs.scope }}
      candidate: true

  candidates:
    if: always() && needs.validate.result == 'success' && (needs.gates.result == 'success' || (needs.gates.result == 'skipped' && needs.validate.outputs.qualified == 'true'))
    needs: [validate, gates]
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ needs.validate.outputs.candidate_run || github.run_id }}
      attempt: ${{ needs.validate.outputs.candidate_attempt || github.run_attempt }}
      assistant_ids: ${{ steps.select.outputs.assistant_ids }}
      guardian_ids: ${{ steps.select.outputs.guardian_ids }}
      portal_ids: ${{ steps.select.outputs.portal_ids }}
      assets_ids: ${{ steps.select.outputs.assets_ids }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ needs.validate.outputs.scope }}
          CANDIDATE_RUN_ID: ${{ needs.validate.outputs.candidate_run || github.run_id }}
          CANDIDATE_ATTEMPT: ${{ needs.validate.outputs.candidate_attempt || github.run_attempt }}
        run: node scripts/release-qualification.mjs --select-artifacts

  images:
    if: needs.validate.outputs.scope == 'full'
    name: Publish ${{ matrix.image }} image
    needs: [validate, candidates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [assistant, guardian, portal]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.candidates.outputs[format('{0}_ids', matrix.image)] }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.candidates.outputs.run_id }}
          path: candidate
          digest-mismatch: error
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        if: inputs.dry_run != true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: promote
        name: Promote the exact native-tested OCI images
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          COMPONENT: ${{ matrix.image }}
          CANDIDATE_RUN_ID: ${{ needs.candidates.outputs.run_id }}
          CANDIDATE_ATTEMPT: ${{ needs.candidates.outputs.attempt }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/release-candidate.mjs promote candidate "${COMPONENT}"
      - uses: sigstore/cosign-installer@v4.1.2
        if: inputs.dry_run != true
        with:
          cosign-release: v3.1.4
      - name: Sign the immutable manifest
        if: inputs.dry_run != true
        env:
          COMPONENT: ${{ matrix.image }}
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: cosign sign --yes "fwdslsh/fhold-${COMPONENT}@${DIGEST}"

  release:
    if: >-
      always() && needs.validate.result == 'success' && needs.candidates.result == 'success' &&
      (needs.images.result == 'success' || (needs.images.result == 'skipped' && needs.validate.outputs.scope == 'tools'))
    needs: [validate, candidates, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.candidates.outputs.assets_ids }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.candidates.outputs.run_id }}
          path: candidate
          digest-mismatch: error
      - name: Verify and assemble the exact final artifact bytes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SCOPE: ${{ needs.validate.outputs.scope }}
          CANDIDATE_RUN_ID: ${{ needs.candidates.outputs.run_id }}
          CANDIDATE_ATTEMPT: ${{ needs.candidates.outputs.attempt }}
        run: node scripts/release-candidate.mjs assemble candidate dist
      - name: Verify the Claude Desktop extension is present
        if: needs.validate.outputs.scope == 'full'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: test -f "dist/fhold-claude-desktop-${VERSION}.mcpb"
      - name: Create checksums
        run: |
          cd dist
          sha256sum -- * > checksums-sha256.txt
      - name: Write manifest and validate the complete release
        env:
          SCOPE: ${{ needs.validate.outputs.scope }}
          RELEASE_ASSETS_DIR: dist
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          bun scripts/validate-admin-update-feeds.mjs
          node scripts/validate-release-assets.mjs --write-manifest
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: fhold-release-assets
          path: dist
      - uses: docker/setup-buildx-action@v4.4.1
        if: inputs.dry_run != true && needs.validate.outputs.scope == 'full'
      - uses: docker/login-action@v4.7.0
        if: inputs.dry_run != true && needs.validate.outputs.scope == 'full'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Point the release channel at the verified immutable images
        if: inputs.dry_run != true && needs.validate.outputs.scope == 'full'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          for component in assistant guardian portal; do
            docker buildx imagetools create \
              --tag "fwdslsh/fhold-${component}:${CHANNEL}" \
              "fwdslsh/fhold-${component}:${VERSION}"
          done
      - name: Publish the verified GitHub release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          SCOPE: ${{ needs.validate.outputs.scope }}
        run: |
          set -euo pipefail
          # Published versions are immutable; never overwrite their assets.
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'Release already exists; use a new version rather than replacing downloads.' >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const sections = readFileSync('CHANGELOG.md', 'utf8').split(/^## /m);
          const section = sections.find((text) => text.startsWith(`${process.env.VERSION} —`));
          if (!section) throw new Error('Missing release notes in CHANGELOG.md');
          const runtime = JSON.parse(readFileSync('packages/skeleton/package.json', 'utf8')).version;
          const scopeNote = process.env.SCOPE === 'tools' ? `\nTooling-only release: CLI and Admin downloads. Container images remain pinned to ${runtime}; no runtime upgrade is required.\n` : '';
          writeFileSync('release-notes.md', section.slice(section.indexOf('\n') + 1).trim() + '\n' + scopeNote);
          NODE
          args=(release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_SHA}" --title "fhold ${VERSION}" --notes-file release-notes.md --generate-notes --draft)
          if [ "${PRERELEASE}" = true ]; then args+=(--prerelease --latest=false); fi
          gh "${args[@]}" dist/*
          # Verify the uploaded files before making the release public.
          gh release download "${VERSION}" --repo "${GITHUB_REPOSITORY}" --dir verified-assets
          (cd verified-assets && sha256sum --check --strict checksums-sha256.txt)
          RELEASE_ASSETS_DIR=verified-assets node scripts/validate-release-assets.mjs
          RELEASE_ASSETS_DIR=verified-assets bun scripts/validate-admin-update-feeds.mjs
          gh release edit "${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false
